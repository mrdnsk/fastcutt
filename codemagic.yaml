workflows:
  android-build:
    name: FastCut Android Build
    max_build_duration: 40
    environment:
      flutter: stable
    scripts:
      - name: Create flutter project (android)
        script: |
          flutter create . --platforms=android
      - name: Get packages
        script: flutter pub get
      - name: Patch ffmpeg_kit for new AGP
        script: |
          PLUG_DIR="$HOME/.pub-cache/hosted/pub.dev/ffmpeg_kit_flutter_full_gpl-4.5.1/android"
          FILE="$PLUG_DIR/build.gradle"
          echo "Plugin dir: $PLUG_DIR"
          if [ -f "$FILE" ]; then
            if ! grep -q "com.arthenica.ffmpegkit" "$FILE"; then
              cat >> "$FILE" << 'EOF'

android {
    namespace "com.arthenica.ffmpegkit"
}
EOF
              echo "ffmpeg_kit patched with android{namespace}"
            else
              echo "ffmpeg_kit already patched"
            fi
          else
            echo "ffmpeg kit build.gradle not found"
          fi
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
